name: OSINT collection watchdog
on:
  schedule:
    - cron: '11,31,51 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: gulfastra-collection-watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the actual data-branch manifest, not workflow start timestamps
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const title='[GULFASTRA] Collector data is stale';
            let ageMinutes=Infinity, reason='No valid successful collection timestamp';
            try {
              const result=await github.rest.repos.getContent({
                owner,repo,path:'data/live-manifest.json',ref:'intelligence-data'
              });
              const doc=JSON.parse(Buffer.from(result.data.content,'base64').toString('utf8'));
              const stamp=Date.parse(doc.collected_at||'');
              if (Number.isFinite(stamp)) {
                ageMinutes=(Date.now()-stamp)/60000;
                reason='Last successful collection '+Math.round(ageMinutes)+' minutes ago';
              }
              core.info('Manifest generated at '+(doc.generated_at||'unavailable'));
              core.info('Last successful collection '+(doc.collected_at||'unavailable'));
              core.info('Source health '+(doc.healthy_sources??'?')+'/'+(doc.source_count??'?'));
            } catch (error) {
              reason='Cannot read or parse intelligence-data manifest: '+String(error).slice(0,180);
            }
            const issues=await github.paginate(github.rest.issues.listForRepo,{
              owner,repo,state:'open',per_page:100
            });
            const existing=issues.find(i=>i.title===title&&!i.pull_request);
            const stale=!Number.isFinite(ageMinutes)||ageMinutes>45||ageMinutes< -10;
            if (stale) {
              core.warning('Collection watchdog warning: '+reason);
              if (!existing) {
                await github.rest.issues.create({
                  owner,repo,title,
                  body:'The independent collection watchdog detected stale public data.\n\n'
                   +'**Diagnostic:** '+reason+'\n\n'
                   +'Check [collector workflow](../actions/workflows/collect.yml), recent job logs, '
                   +'source health, rate limits, quality-gate state and data-branch publishing.\n\n'
                   +'This is an operational availability alert, NOT a security incident or public emergency warning. '
                   +'It will close automatically after collection recovers.'
                });
              }
            } else {
              core.info('Collection freshness healthy: '+Math.round(ageMinutes)+' minutes old');
              if (existing) {
                await github.rest.issues.createComment({owner,repo,issue_number:existing.number,
                  body:'Watchdog recovery: '+reason+'. The stale-collector incident is closing.'});
                await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
              }
            }
