name: Publish Gulfastra
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "command/**"
      - "legacy-v9.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R index.html assets data command legacy-v9.html _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/command/index.html
          test -s _site/legacy-v9.html
          test -s _site/assets/command11.js
          echo "GULFASTRA X entry point, application and rollback included in deployment"
          find _site -maxdepth 2 -type f -name 'index.html' -print
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
