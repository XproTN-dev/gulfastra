name: Publish Gulfastra
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "command/**"
      - "legacy-v9.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R index.html assets data command legacy-v9.html _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/command/index.html
          test -s _site/legacy-v9.html
          test -s _site/assets/command11.js
          echo "GULFASTRA X entry point, application and rollback included in deployment"
          find _site -maxdepth 2 -type f -name 'index.html' -print
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the actual public v11 route and legacy rollback return HTTP 200
        run: |
          set -euo pipefail
          base="https://xprotn-dev.github.io/gulfastra"
          ready=0
          for attempt in $(seq 1 15); do
            echo "Deployment HTTP check attempt $attempt"
            if curl --fail --silent --show-error --location --max-time 12 "$base/command/" | grep -q "GULFASTRA X"; then
              ready=1
              break
            fi
            sleep 8
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Deployed command route is missing or not serving the v11 application."
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 15 "$base/legacy-v9.html" | grep -q 'assets/v9.css'
          curl --fail --silent --show-error --location --max-time 15 "$base/assets/command11.js" | grep -q 'GXApp'
          echo "Live GitHub Pages v11 route, JS and v9 rollback verified"

