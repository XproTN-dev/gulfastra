name: Publish Gulfastra
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "command/**"
      - "lab/**"
      - "legacy-v9.html"
      - "assets/**"
      - "scripts/prepare_maplibre_vendor.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle pinned MapLibre GL JS locally
        run: bash scripts/prepare_maplibre_vendor.sh
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R index.html assets data command lab legacy-v9.html vendor _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/command/index.html
          test -s _site/lab/index.html
          test -s _site/assets/impact-lab.js
          test -s _site/assets/impact-lab-render.js
          test -s _site/assets/impact-lab.css
          test -s _site/legacy-v9.html
          test -s _site/assets/command11.js
          test -s _site/assets/command11-bootstrap.mjs
          test -s _site/vendor/maplibre-gl.mjs
          test -s _site/vendor/maplibre-gl-worker.mjs
          test -s _site/vendor/maplibre-gl.css
          echo "GULFASTRA X entry point, application and rollback included in deployment"
          find _site -maxdepth 2 -type f -name 'index.html' -print
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the actual public v11 route and legacy rollback return HTTP 200
        run: |
          set -euo pipefail
          base="https://xprotn-dev.github.io/gulfastra"
          ready=0
          for attempt in $(seq 1 15); do
            echo "Deployment HTTP check attempt $attempt"
            if curl --fail --silent --show-error --location --max-time 12 --output /tmp/gulfastra-command.html "$base/command/" && grep -q "GULFASTRA X" /tmp/gulfastra-command.html; then
              ready=1
              break
            fi
            sleep 8
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Deployed command route is missing or not serving the v11 application."
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 15 --output /tmp/gulfastra-legacy.html "$base/legacy-v9.html"
          grep -q 'assets/v9.css' /tmp/gulfastra-legacy.html
          curl --fail --silent --show-error --location --max-time 15 --output /tmp/gulfastra-v11.js "$base/assets/command11.js"
          grep -q 'GXApp' /tmp/gulfastra-v11.js
          curl --fail --silent --show-error --location --max-time 20 --output /tmp/gulfastra-maplibre.mjs "$base/vendor/maplibre-gl.mjs"
          curl --fail --silent --show-error --location --max-time 20 --output /tmp/gulfastra-maplibre-worker.mjs "$base/vendor/maplibre-gl-worker.mjs"
          curl --fail --silent --show-error --location --max-time 15 --output /tmp/gulfastra-maplibre.css "$base/vendor/maplibre-gl.css"
          test "$(wc -c </tmp/gulfastra-maplibre.mjs)" -gt 100000
          test -s /tmp/gulfastra-maplibre-worker.mjs
          test -s /tmp/gulfastra-maplibre.css
          curl --fail --silent --show-error --location --max-time 15 --output /tmp/gulfastra-lab.html "$base/lab/"
          grep -q "GULFASTRA X · Impact Lab" /tmp/gulfastra-lab.html
          curl --fail --silent --show-error --location --max-time 15 --output /tmp/gulfastra-lab.js "$base/assets/impact-lab.js"
          grep -q "GXImpactApp" /tmp/gulfastra-lab.js
          echo "Live GitHub Pages v11 and v12 lab routes, self-hosted MapLibre and exact v9 rollback verified"

