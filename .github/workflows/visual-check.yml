name: Visual & functional website check
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'index.html'
      - 'command/**'
      - '.github/workflows/visual-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare self-hosted MapLibre ES modules
        run: bash scripts/prepare_maplibre_vendor.sh
      - name: Install browser test tools
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: Start static website
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/gulfastra.log 2>&1 &
          sleep 2
      - name: Validate Arabic classification
        run: python scripts/test_arabic.py
      - name: Validate conservative source fusion
        run: python scripts/test_fusion.py
      - name: Check v11 desktop and mobile visual behavior
        run: python scripts/visual_check_v11.py
      - name: Save actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gulfastra-visual-screenshots
          path: visual-check/
          if-no-files-found: warn
