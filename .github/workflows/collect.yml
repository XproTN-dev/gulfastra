name: Refresh OSINT reports
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gulfastra-collect-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out collector code
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false
      - name: Check out independent live data branch
        uses: actions/checkout@v4
        with:
          ref: intelligence-data
          path: archive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect published Gulf news
        env:
          GULFASTRA_DATA_DIR: ${{ github.workspace }}/archive/data
        run: python source/scripts/collect.py
      - name: Correlate sources and retain revisions
        env:
          GULFASTRA_DATA_DIR: ${{ github.workspace }}/archive/data
        run: python source/scripts/fusion.py
      - name: Assess critical public reporting without historical backfill alerts
        env:
          GULFASTRA_DATA_DIR: ${{ github.workspace }}/archive/data
        run: python source/scripts/alerts.py
      - name: Collect independent natural hazards
        env:
          GULFASTRA_DATA_DIR: ${{ github.workspace }}/archive/data
          CF_RADAR_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
        run: python source/scripts/observations.py
      - name: Write tiny source-manifest for browser synchronization
        env:
          GULFASTRA_DATA_DIR: ${{ github.workspace }}/archive/data
        run: python source/scripts/publish_manifest.py
      - name: Commit data ONLY on intelligence-data branch
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json data/events.json data/revisions.json data/alerts.json data/alert_state.json data/observations.json data/sitrep.md data/sitrep-ar.md data/live-manifest.json
          if git diff --cached --quiet; then
            echo "No updated public data"
            exit 0
          fi
          git commit -m "data: refresh Gulf intelligence without Pages deployment"
          for attempt in 1 2 3 4; do
            if git pull --rebase -X theirs origin intelligence-data && git push origin HEAD:intelligence-data; then
              echo "Published data branch without code/Pages deployment"
              exit 0
            fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
      - name: Optional Telegram reporting digest
        env:
          GULFASTRA_DATA_DIR: ${{ github.workspace }}/archive/data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python source/scripts/telegram_digest.py
      - name: Persist optional alert watermark
        working-directory: archive
        run: |
          if [ -f data/telegram_state.json ]; then
            git add data/telegram_state.json
            if ! git diff --cached --quiet; then
              git commit -m "data: store optional digest watermark"
              git pull --rebase -X theirs origin intelligence-data
              git push origin HEAD:intelligence-data
            fi
          fi
